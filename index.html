<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Bancos Airtm - Vercel</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; font-size: 20px; color: #4da6ff; }
    .status-bar { font-size: 14px; margin-bottom: 20px; color: #aaa; display: flex; justify-content: space-between; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
    th { background: #252525; color: #fff; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .badge-open { background: #1b5e20; color: #81c784; }
    .badge-closed { background: #b71c1c; color: #e57373; }
  </style>
</head>
<body>

<div class="container">
  <h1>🇻🇪 Monitor de Estatus de Bancos Airtm</h1>
  <div class="status-bar">
    <span id="last-update">Última actualización: Cargando...</span>
    <span id="timer">Próximo escaneo en: 10s</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Banco / Método</th>
        <th>Estatus</th>
        <th>Min. Tx</th>
        <th>Hora Local (Vzla)</th>
      </tr>
    </thead>
    <tbody id="bank-table">
      <tr><td colspan="4">Consultando datos...</td></tr>
    </tbody>
  </table>
</div>

<script>
  let countdown = 10;

  async function fetchBankStatus() {
    try {
      const res = await fetch('/api/check');
      const data = await res.json();

      if (data.success) {
        document.getElementById('last-update').innerText = `Última actualización: ${data.lastChecked}`;
        const tbody = document.getElementById('bank-table');
        tbody.innerHTML = '';

        data.banks.forEach(item => {
          const isOpen = item.status.toLowerCase().includes('open');
          const badgeClass = isOpen ? 'badge-open' : 'badge-closed';
          
          tbody.innerHTML += `
            <tr>
              <td><b>${item.bankName}</b></td>
              <td><span class="badge ${badgeClass}">${item.status}</span></td>
              <td>${item.minTx}</td>
              <td>${item.time}</td>
            </tr>
          `;
        });
      }
    } catch (err) {
      console.error('Error al actualizar datos:', err);
    }
  }

  // Ejecutar inmediatamente
  fetchBankStatus();

  // Temporizador visual y recarga constante
  setInterval(() => {
    countdown--;
    document.getElementById('timer').innerText = `Próximo escaneo en: ${countdown}s`;
    
    if (countdown <= 0) {
      countdown = 10;
      fetchBankStatus();
    }
  }, 1000);
</script>

</body>
</html>
